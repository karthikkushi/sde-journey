<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The phone's status bar takes the top bar's colour (--chrome in src/index.css; also in src/lib/theme.ts). -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090b0c" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A 15-month study plan from Python basics to SDE interviews." />
    <title>SDE Journey</title>
    <script>
      // Set the saved theme before the page paints, so there is no white flash at night.
      try {
        var t = localStorage.getItem('sdej-theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.querySelectorAll('meta[name=theme-color]').forEach(function (m) { m.content = t === 'dark' ? '#090b0c' : '#ffffff' })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
